[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iqe-agents"
version = "0.2.0"
description = "IQE CI 分诊的 6 个 Mock Agent：monitor / triage / reproduction / ticket / review / reporting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — internal demo of IQE-SUZHOU" }
authors = [{ name = "IQE-SUZHOU" }]
dependencies = [
    "aio-pika==10.2.3",
    "asyncpg==0.32.0",
    "fastapi==0.165.0",
    "starlette==1.10.0",
    "uvicorn[standard]==0.54.0",
    "jsonschema==4.26.0",
    "python-ulid==4.2.0",
    "PyYAML==6.0.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff>=0.17", "black>=25", "isort>=6", "mypy>=1.18"]

[project.scripts]
ci-agent-monitor = "iqe_agents.monitor.main:main"
ci-agent-triage = "iqe_agents.triage.main:main"
ci-agent-reproduction = "iqe_agents.reproduction.main:main"
ci-agent-ticket = "iqe_agents.ticket.main:main"
ci-agent-review = "iqe_agents.review.main:main"
ci-agent-reporting = "iqe_agents.reporting.main:main"
ci-selfcheck = "iqe_agents.tools.selfcheck:main"

[project.urls]
Repository = "https://github.com/IQE-SUZHOU/iqe-agent-orchestrator"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
