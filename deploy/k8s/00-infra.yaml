apiVersion: v1
kind: Namespace
metadata:
  name: ci-triage
  labels:
    app.kubernetes.io/part-of: ci-triage-demo
---
# 凭证不进仓库：下面两个 Secret 由 deploy/deploy.sh 从 deploy/secrets.env 生成，
# Deployment 只引用名字（envFrom.secretRef）。
#   ci-triage-credentials : PG_DSN + AMQP_ORCH + AMQP_{MONITOR,TRIAGE,REPRODUCTION,TICKET,REVIEW,REPORTING}
#   harbor-pull           : kubernetes.io/dockerconfigjson
# 手工重建的等价命令见 deploy/README.md（Secrets 一节）。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-triage-config
  namespace: ci-triage
data:
  APP_ENV: demo
  HTTP_PORT: "8080"
  LOG_LEVEL: info
  LOG_JSON: "true"
  # schemas / workflows / fixtures 的默认位置在包内 <pkg>/common/data/（pip 安装即到位），
  # 需要覆盖时再设 DATA_DIR 或 SCHEMAS_DIR / FIXTURES_DIR / WORKFLOWS_DIR
  PLANS_DIR: /var/lib/ci-triage/plans   # 可写：封存计划（emptyDir 挂载）
  PLAN_MODE: auto
  MOCK_LLM_ENABLED: "true"
  MOCK_DELAY_MS: "150:500"
  MOCK_SCENARIO: default
  STAGE_TIMEOUT_S: "30"
  STAGE_MAX_ATTEMPTS: "2"
  MAX_REVIEW_LOOPS: "2"
  MAX_PLAN_STEPS: "8"
  MAX_INFLIGHT_CASES: "4"
  RECURSION_LIMIT: "40"
  MONITOR_SCAN_INTERVAL_S: "3600"
  SCHEDULER_ENABLED: "true"
  REPORT_AT: "18:00"
  REPORT_TZ: UTC                 # 日报的日界（与 Postgres now() 一致，跨时区不会漏统计）
  SCAN_STARTUP_DELAY_S: "30"     # 编排层就绪后到第一次定时扫描的宽限期
  TTL_MS: "900000"               # 命令在队列里超过 15 分钟就进 DLQ（expired）
  TICKET_AUTOCREATE: "true"
  TICKET_BACKEND: jira-mock
  REPRO_ENABLED: "true"
