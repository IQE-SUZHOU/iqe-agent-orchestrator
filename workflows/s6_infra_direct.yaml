key: s6_infra_direct
title: 基础设施类失败（签名族 ci-infra:*）：不占重跑机位，成单后复核归档
enabled: true
priority: 150
version: 1
match:
  signal: error
  signature_family_prefix: "ci-infra:"
steps:
  - id: t1
    stage: triage
    mode: full
  - id: k1
    stage: ticket
    mode: run
  - id: v1
    stage: review
    mode: run
    "on":
      approve: { next: p1 }
      needs_info: { jump: t1, max_loops: 2, set_status: triaged }
      reject: { end: true, set_status: closed_rejected }
  - id: p1
    stage: reporting
    mode: case
