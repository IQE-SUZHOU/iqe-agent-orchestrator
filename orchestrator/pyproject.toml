[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iqe-orchestrator"
version = "0.2.0"
description = "IQE CI 分诊编排层：LangGraph 状态机 + 计划层（workflow/LLM）+ Dispatch-Await 网关 + Web UI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — internal demo of IQE-SUZHOU" }
authors = [{ name = "IQE-SUZHOU" }]
dependencies = [
    "aio-pika==10.2.3",
    "asyncpg==0.32.0",
    "fastapi==0.165.0",
    "starlette==1.10.0",
    "jinja2==3.1.6",
    "uvicorn[standard]==0.54.0",
    "jsonschema==4.26.0",
    "python-ulid==4.2.0",
    "PyYAML==6.0.4",
    "langgraph==1.2.24",
    "langgraph-checkpoint-postgres==3.2.1",
    "psycopg[binary,pool]==3.3.9",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff>=0.17", "black>=25", "isort>=6", "mypy>=1.18"]

[project.scripts]
ci-orchestrator = "iqe_orchestrator.main:main"
ci-graph-smoke = "iqe_orchestrator.tools.graph_smoke:main"
ci-ui-check = "iqe_orchestrator.tools.ui_render_check:main"
ci-broker-setup = "iqe_orchestrator.tools.setup_broker:main"
ci-db-migrate = "iqe_orchestrator.migrate:main"

[project.urls]
Repository = "https://github.com/IQE-SUZHOU/iqe-agent-orchestrator"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
