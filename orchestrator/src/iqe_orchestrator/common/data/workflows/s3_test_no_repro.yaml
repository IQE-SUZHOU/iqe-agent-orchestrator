key: s3_test_no_repro
title: 测试类失败（签名族 test:*）：跳过 4b 受控复现，走内部修复 → 5a 验证
enabled: true
priority: 150
version: 2
match:
  signal: error
  signature_family_prefix: "test:"
steps:
  - id: t1
    stage: triage
    mode: classify
  - id: g1
    stage: reviewer
    mode: gate1
    "on":
      internal: { next: r1, set_status: routed_internal }
      external: { next: c1, set_status: routed_external }
      approve: { next: r1 }
      needs_info: { jump: t1, max_loops: 2, set_status: triaged }
      reject: { end: true, set_status: closed_rejected }
  - id: r1
    stage: remediation
    mode: fix
  - id: v1
    stage: reproduction
    mode: verify
  - id: g2
    stage: reviewer
    mode: gate2
    "on":
      approve: { next: p1, set_status: fix_approved }
      rework: { jump: r1, max_loops: 2, set_status: remediated }
      reject: { end: true, set_status: closed_rejected }
  - id: c1
    stage: regression
    mode: check
    "on":
      regression: { next: b1, set_status: regression_checked }
      not_regression: { next: k1, set_status: triaged }
  - id: b1
    stage: regression
    mode: bisect
  - id: k1
    stage: ticketing
    mode: create
  - id: g3
    stage: reviewer
    mode: gate3
    "on":
      approve: { next: p1, set_status: ticket_approved }
      needs_info: { jump: k1, max_loops: 2, set_status: ticketed }
      reject: { end: true, set_status: closed_rejected }
  - id: p1
    stage: reporting
    mode: case
